name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Formulas are typeset by Typst. No ffmpeg: the fast checks draw no video.
      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt ruff

      - name: Lint
        run: .venv/bin/ruff check

      # Builds every film (runs its script up to `render`), typesets every formula, and
      # checks `year` against the almanac. Rendering every example takes minutes: run
      # `python tests/run.py --render` locally, before a release.
      - name: Tests
        run: .venv/bin/python tests/run.py
